# Configuración de Netlify: cada push a main compila y publica la app.
# Antes de compilar corren las pruebas unitarias: si alguna falla, no se publica y el sitio sigue con la versión anterior.
# (Las pruebas de punta a punta corren en GitHub Actions: .github/workflows/pruebas.yml.)
[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El service worker, el HTML y el manifest no se guardan en caché,
# así el teléfono siempre puede enterarse de que hay una versión nueva.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw-transicion.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw-compartir.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos de /assets llevan un hash en el nombre: se pueden guardar para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# "Compartir → a mano." la primera vez, antes de que el service worker esté activo: abre la app en importar.
[[redirects]]
  from = "/compartir"
  to = "/#/importar"
  status = 303
