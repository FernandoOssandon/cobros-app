# Pruebas automáticas: corren en cada push y en cada pull request.
# Si algo falla, GitHub marca el commit con una ✗ y te avisa por correo.
# (Netlify, además, corre las pruebas unitarias antes de publicar: ver netlify.toml.)
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    # Ubuntu fijo: ubuntu-latest pasó a 26.04 y Playwright 1.56 todavía no instala Chromium ahí.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Santiago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos y compilación
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npx playwright test
      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7

  # Núcleo en Kotlin Multiplatform: pruebas en JVM y en JavaScript contra los vectores generados desde TypeScript.
  nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nucleo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y probar el núcleo (JVM y JavaScript)
        run: bash ./gradlew build --no-daemon

  # App Android: compila el APK (con el código común del núcleo adentro) y lo deja para descargar
  # en la página de la ejecución, sección "Artifacts" → "a-mano-android".
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar el APK
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: a-mano-android
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
