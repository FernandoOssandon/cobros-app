# Pruebas automáticas: corren en cada push y en cada pull request.
# Si algo falla, GitHub marca el commit con una ✗ y te avisa por correo.
# (Netlify, además, corre las pruebas unitarias antes de publicar: ver netlify.toml.)
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Santiago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos y compilación
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npx playwright test
      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
